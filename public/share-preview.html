<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}} · {{site}}</title>
<meta name="description" content="{{description}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{site}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{image}}">
<meta http-equiv="refresh" content="0; url={{story}}">
</head>
<body style="background:#2a1a10;color:#efe6d2;font:16px/1.5 'Courier New',monospace;padding:24px">
<p>{{title}}</p>
<p><a href="{{story}}" style="color:#f2c66b">Open the story</a> (the receiver may ask you to sign in).</p>
</body>
</html>
