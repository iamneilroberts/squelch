<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<title>{{title}}</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="share.css">
</head>
<body class="card-body">
<div class="og">
  <div class="og-bar"><span class="brand">{{script}}</span><span class="og-site">{{channel}}</span></div>
  <div class="og-main"><h1 class="og-title">{{title}}</h1><p class="og-summary">{{summary}}</p></div>
  <p class="og-meta">{{when}}<span class="og-place">{{place}}</span></p>
  <p class="og-count">▶ {{count}} · tap to listen</p>
</div>
</body>
</html>
